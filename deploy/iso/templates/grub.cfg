# MoonShield UEFI boot menu
set default=moonshield-install
set timeout=4
set timeout_style=menu

if insmod all_video; then
    set gfxmode=auto
fi
if insmod gfxterm && loadfont /boot/grub/font.pf2; then
    terminal_output gfxterm
    if insmod gfxmenu; then
        set theme=/boot/grub/moonshield-theme.txt
    fi
fi

menuentry 'Instalar MoonShield' --id=moonshield-install {
    linux /install.amd/vmlinuz auto=true priority=critical noshell BOOT_DEBUG=0 DEBIAN_FRONTEND=newt theme=dark fb=true language=pt country=BR locale=pt_BR.UTF-8 keymap=br hostname=moonshield domain=local preseed/file=/cdrom/preseed.cfg preseed/interactive=false --- quiet
    initrd /install.amd/initrd.gz
}

menuentry 'Modo compativel de video' --id=moonshield-compatible {
    linux /install.amd/vmlinuz auto=true priority=critical noshell BOOT_DEBUG=0 DEBIAN_FRONTEND=newt theme=dark fb=false vga=normal nomodeset language=pt country=BR locale=pt_BR.UTF-8 keymap=br hostname=moonshield domain=local preseed/file=/cdrom/preseed.cfg preseed/interactive=false --- quiet
    initrd /install.amd/initrd.gz
}
