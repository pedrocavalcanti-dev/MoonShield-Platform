<!-- TOPBAR -->
<header class="sp-topbar">
    <div class="sp-topbar__left">
        <button
            class="sp-icon-btn sp-topbar__menu"
            id="btnOpenSidebar"
            type="button"
            aria-label="Abrir menu"
        >
            <svg
                width="19"
                height="19"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

        <div class="sp-page-heading">
            <span class="sp-page-heading__eyebrow">
                Segurança de rede
            </span>

            <div class="sp-page-heading__line">
                <h1>Suricata</h1>

                <span
                    class="sp-chip sp-chip--pending"
                    id="headerStackChip"
                >
                    <span class="sp-chip__dot"></span>
                    <span id="headerStackText">Verificando</span>
                </span>
            </div>
        </div>
    </div>

    <div class="sp-topbar__right">
        <div class="sp-last-update">
            <span>Última atualização</span>
            <strong id="lastUpdateText">agora</strong>
        </div>

        <button
            class="sp-icon-btn"
            id="btnRefreshStatus"
            type="button"
            aria-label="Atualizar status"
            title="Atualizar status"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
            >
                <path d="M20 11a8.1 8.1 0 1 0 2 5.3" />
                <path d="M20 4v7h-7" />
            </svg>
        </button>

        <button
            class="sp-btn sp-btn--primary sp-btn--compact"
            id="btnRunDiagnosticTop"
            type="button"
        >
            <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-4-4" />
            </svg>
            Diagnosticar
        </button>
    </div>
</header>
