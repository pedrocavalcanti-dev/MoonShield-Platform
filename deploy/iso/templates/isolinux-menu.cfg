menu hshift 6
menu width 68
menu margin 4
menu rows 8
menu tabmsgrow 18
menu cmdlinerow 18
menu timeoutrow 20
menu title MOONSHIELD - Appliance de Segurança de Rede
menu background #050507
menu color title        * #ffffffff #00000000 *
menu color border       * #00000000 #00000000 none
menu color sel          * #ffffffff #5b5af3ff *
menu color unsel        * #c8c8d0ff #00000000 *
menu color hotkey       * #9595fbff #00000000 *
menu color hotsel       * #ffffffff #5b5af3ff *
menu color timeout      * #9595fbff #00000000 *
menu color tabmsg       * #9a9aa5ff #00000000 *

timeout 50
prompt 0

label moonshield-install
    menu label ^Instalar MoonShield
    menu default
    kernel /install.amd/vmlinuz
    append vga=788 initrd=/install.amd/initrd.gz auto=true priority=critical language=pt country=BR locale=pt_BR.UTF-8 keymap=br hostname=moonshield domain=local preseed/file=/preseed.cfg --- quiet

label moonshield-advanced
    menu label ^Opções avançadas
    kernel /install.amd/vmlinuz
    append vga=788 initrd=/install.amd/initrd.gz language=pt country=BR locale=pt_BR.UTF-8 keymap=br priority=low --- quiet
