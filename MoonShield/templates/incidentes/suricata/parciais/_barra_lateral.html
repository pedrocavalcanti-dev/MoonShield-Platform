<!-- ============================================================
     SIDEBAR
============================================================= -->
<aside class="sp-sidebar" id="panelSidebar">

    <div class="sp-sidebar__head">
        <a
            href="{% url 'incidentes:suricata_painel' %}"
            class="sp-brand"
            aria-label="MoonShield Suricata"
        >
            <img
                class="sp-brand__shield"
                src="{% static 'favicon/favicon-32x32.png' %}"
                alt=""
                aria-hidden="true"
            />

            <span class="sp-brand__copy">
                <strong>MoonShield</strong>
                <small>Suricata IDS</small>
            </span>
        </a>

        <button
            class="sp-sidebar__close"
            id="btnCloseSidebar"
            type="button"
            aria-label="Fechar menu"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="M18 6 6 18M6 6l12 12" />
            </svg>
        </button>
    </div>

    <button
        class="sp-sidebar__collapse"
        id="btnCollapseSidebar"
        type="button"
        aria-label="Recolher barra lateral"
        aria-expanded="true"
        title="Recolher barra lateral"
    >
        <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="M14 6 8 12l6 6" />
        </svg>
    </button>

    <div class="sp-sidebar__section-label">Monitoramento</div>

    <nav class="sp-nav" aria-label="Navegação do Suricata">
        <button
            class="sp-nav__item is-active"
            type="button"
            data-section-target="overview"
            aria-label="Visão geral"
            title="Visão geral"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
            </span>
            <span>Visão geral</span>
        </button>

        <button
            class="sp-nav__item"
            type="button"
            data-section-target="health"
            aria-label="Saúde da stack"
            title="Saúde da stack"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M3 12h4l2.2-6 4.1 12 2.2-6H21" />
                </svg>
            </span>
            <span>Saúde da stack</span>
        </button>

        <button
            class="sp-nav__item"
            type="button"
            data-section-target="configuration"
            aria-label="Configuração"
            title="Configuração"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.04 4.3l.06.06A1.65 1.65 0 0 0 8.92 4a1.65 1.65 0 0 0 1-1.51V2a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.12.6.65 1 1.26 1H21a2 2 0 1 1 0 4h-.09c-.61 0-1.14.4-1.51 1Z" />
                </svg>
            </span>
            <span>Configuração</span>
        </button>

        <button
            class="sp-nav__item"
            type="button"
            data-section-target="rules"
            aria-label="Regras"
            title="Regras"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M4 4h16v16H4z" />
                    <path d="M8 9h8M8 13h8M8 17h5" />
                </svg>
            </span>
            <span>Regras</span>
        </button>

        <button
            class="sp-nav__item"
            type="button"
            data-section-target="tasks"
            aria-label="Tarefas"
            title="Tarefas"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M9 11l3 3L22 4" />
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                </svg>
            </span>
            <span>Tarefas</span>
            <span class="sp-nav__badge" id="navTaskBadge" hidden>0</span>
        </button>

        <button
            class="sp-nav__item"
            type="button"
            data-section-target="diagnostic"
            aria-label="Diagnóstico"
            title="Diagnóstico"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-4-4" />
                    <path d="M8 11h6M11 8v6" />
                </svg>
            </span>
            <span>Diagnóstico</span>
        </button>
    </nav>

    <div class="sp-sidebar__section-label">Atalhos</div>

    <nav class="sp-nav sp-nav--secondary">
        <a
            class="sp-nav__item"
            href="{% url 'incidentes:suricata_onboarding' %}"
            aria-label="Configurar Suricata"
            title="Configurar Suricata"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                </svg>
            </span>
            <span>Configurar Suricata</span>
        </a>

        <a
            class="sp-nav__item"
            href="{% url 'painel:index' %}"
            aria-label="Voltar ao MoonShield"
            title="Voltar ao MoonShield"
        >
            <span class="sp-nav__icon">
                <svg
                    width="17"
                    height="17"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M3 12 12 3l9 9" />
                    <path d="M5 10v11h14V10" />
                </svg>
            </span>
            <span>Voltar ao MoonShield</span>
        </a>
    </nav>

    <div class="sp-sidebar__bottom">
        <div class="sp-mini-status">
            <span
                class="sp-status-dot sp-status-dot--pending"
                id="sidebarStatusDot"
            ></span>

            <span class="sp-mini-status__copy">
                <strong id="sidebarStatusTitle">Verificando...</strong>
                <small id="sidebarStatusText">Aguardando status</small>
            </span>
        </div>

        <div class="sp-sidebar__footer">
            <span>MoonShield 2026</span>
        </div>
    </div>
</aside>

<div
    class="sp-sidebar-backdrop"
    id="sidebarBackdrop"
    aria-hidden="true"
></div>
