set default=moonshield-install
set timeout=5
set timeout_style=menu

if insmod gfxterm && loadfont /boot/grub/font.pf2; then
    set gfxmode=auto
    terminal_output gfxterm
    if insmod gfxmenu; then
        set theme=/boot/grub/moonshield-theme.txt
    fi
fi

menuentry 'Install MoonShield' --id=moonshield-install {
    linux /install.amd/vmlinuz vga=788 language=pt country=BR locale=pt_BR.UTF-8 keymap=br preseed/file=/cdrom/moonshield/preseed.cfg --- quiet
    initrd /install.amd/initrd.gz
}

menuentry 'Advanced options' --id=moonshield-advanced {
    linux /install.amd/vmlinuz vga=788 priority=low --- quiet
    initrd /install.amd/initrd.gz
}
