# MoonShield Appliance ISO — Debian Installer preseed
# UX visível ao usuário: pt-BR. O Debian Installer é usado apenas como motor interno.

### Localização / teclado / relógio
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/theme string dark
d-i localechooser/supported-locales multiselect pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i keyboard-configuration/layoutcode string br
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false
d-i time/zone string America/Sao_Paulo

### Rede inicial — DHCP. A topologia final será configurada no onboarding MoonShield.
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 15
d-i netcfg/dhcpv6_timeout string 5
d-i netcfg/get_hostname string moonshield
d-i netcfg/hostname string moonshield
d-i netcfg/get_domain string local
d-i netcfg/domain string local

### Contas — appliance não cria usuário humano nem senha universal.
# IMPORTANTE: no Debian Installer, passwd/root-login=false força a criação de
# um utilizador normal, mesmo quando passwd/make-user=false está preseedado.
# Mantemos root-login=true apenas durante o d-i, mas travamos a senha root com
# um hash impossível (*). Assim o instalador não cria utilizador humano nem
# pergunta senha, e o root continua sem autenticação por senha.
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password *
d-i passwd/make-user boolean false

### Disco — o script MoonShield pergunta e confirma o disco imediatamente antes do Partman.
# Debian documenta partman/early_command para decisões dinâmicas quando os discos já estão visíveis.
d-i partman/early_command string /bin/sh /moonshield/select-disk.sh

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### APT / tarefas — instalação mínima, offline, sem telas opcionais.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/use_mirror boolean false

d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string python3 openssl ca-certificates locales
d-i pkgsel/install-recommends boolean false
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

### Bootloader — o device é definido pelo seletor MoonShield no mesmo disco do Partman.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Finalização / bootstrap MoonShield
d-i preseed/late_command string /bin/sh /cdrom/moonshield/late-command.sh
d-i finish-install/keep-consoles boolean false
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
