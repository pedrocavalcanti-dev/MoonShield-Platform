<!-- ================================================================
     MOONSHIELD NETWORK
     BARRA SUPERIOR
================================================================ -->

<header class="np-topbar">
    <div class="np-topbar__left">
        <button type="button" class="np-icon-btn np-topbar__menu" id="sidebarOpen" aria-label="Abrir menu" title="Abrir menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M4 7H20M4 12H20M4 17H20"></path>
            </svg>
        </button>

        <div class="np-page-heading">
            <span class="np-page-heading__eyebrow" id="pageEyebrow">Rede</span>
            <div class="np-page-heading__line">
                <h1 id="pageTitle">Visão Geral</h1>
                <span class="np-status-pill np-status-pill--pending" id="topbarAgentStatus">
                    <span class="np-status-dot"></span>
                    Verificando Agent
                </span>
            </div>
        </div>
    </div>

    <div class="np-topbar__right">
        <div class="np-last-update">
            <span>Atualizado</span>
            <strong id="lastUpdateTime">—</strong>
        </div>

        <button type="button" class="np-btn np-btn--ghost np-btn--compact" id="refreshNetworkButton" title="Atualizar dados">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6V11H15"></path>
                <path d="M18.2 17A8 8 0 1 1 20 11"></path>
            </svg>
            <span class="np-btn__label">Atualizar</span>
        </button>

        <button type="button" class="np-btn np-btn--ghost np-btn--compact" id="detectInterfacesButton" title="Detectar interfaces do sistema">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M3 12H6M18 12H21M12 3V6M12 18V21M5.6 5.6L7.7 7.7M16.3 16.3L18.4 18.4M18.4 5.6L16.3 7.7M7.7 16.3L5.6 18.4"></path>
            </svg>
            <span class="np-btn__label">Detectar</span>
        </button>

        <button type="button" class="np-btn np-btn--primary np-btn--compact" id="applyAllButton" title="Aplicar todas as alterações pendentes">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6L9 17L4 12"></path>
            </svg>
            <span class="np-btn__label">Aplicar Tudo</span>
        </button>

        <div class="np-user">
            <div class="np-user__avatar" aria-hidden="true">{{ request.user.username|slice:":1"|upper }}</div>
            <div class="np-user__copy">
                <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
                <span>Administrador</span>
            </div>
        </div>
    </div>
</header>
