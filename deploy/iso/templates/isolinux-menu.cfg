menu hshift 4
menu width 70
menu title MOONSHIELD - Network Security Appliance
timeout 50
prompt 0

label moonshield-install
    menu label ^Install MoonShield
    menu default
    kernel /install.amd/vmlinuz
    append vga=788 initrd=/install.amd/initrd.gz language=pt country=BR locale=pt_BR.UTF-8 keymap=br preseed/file=/cdrom/moonshield/preseed.cfg --- quiet

label moonshield-advanced
    menu label ^Advanced options
    kernel /install.amd/vmlinuz
    append vga=788 initrd=/install.amd/initrd.gz priority=low --- quiet
