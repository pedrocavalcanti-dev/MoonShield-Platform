# MoonShield BIOS/Legacy boot menu
# ASCII-only on purpose: ISOLINUX/firmware code pages vary between machines.
menu hshift 6
menu width 72
menu margin 4
menu rows 10
menu tabmsgrow 19
menu cmdlinerow 20
menu timeoutrow 21
menu title MOONSHIELD // SECURE APPLIANCE INSTALLER
menu background #050507

# MoonShield palette: black / white / purple.  No bitmap dependency, so this
# remains usable on old VGA firmware, VirtualBox, VMware, Hyper-V Gen1 and PCs.
menu color screen       * #ffffffff #050507ff none
menu color title        * #ffffffff #050507ff bold
menu color border       * #5b5af3ff #050507ff none
menu color sel          * #ffffffff #5b5af3ff bold
menu color unsel        * #c8c8d0ff #050507ff none
menu color hotkey       * #9595fbff #050507ff bold
menu color hotsel       * #ffffffff #5b5af3ff bold
menu color timeout      * #9595fbff #050507ff bold
menu color tabmsg       * #8e8e9aff #050507ff none
menu color disabled     * #666672ff #050507ff none
menu color scrollbar    * #5b5af3ff #050507ff none

menu tabmsg [ENTER] selecionar  |  Instalacao offline e protegida

timeout 40
prompt 0

label moonshield-install
    menu label ^Instalar MoonShield
    menu default
    kernel /install.amd/vmlinuz
    append initrd=/install.amd/initrd.gz auto=true priority=critical noshell BOOT_DEBUG=0 DEBIAN_FRONTEND=newt theme=dark fb=true language=pt country=BR locale=pt_BR.UTF-8 keymap=br hostname=moonshield domain=local preseed/file=/cdrom/preseed.cfg preseed/interactive=false --- quiet

label moonshield-compatible
    menu label ^Modo compativel de video
    kernel /install.amd/vmlinuz
    append initrd=/install.amd/initrd.gz auto=true priority=critical noshell BOOT_DEBUG=0 DEBIAN_FRONTEND=newt theme=dark fb=false vga=normal nomodeset language=pt country=BR locale=pt_BR.UTF-8 keymap=br hostname=moonshield domain=local preseed/file=/cdrom/preseed.cfg preseed/interactive=false --- quiet
