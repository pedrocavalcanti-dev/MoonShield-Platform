<!-- ================================================================
     DRAWER DA TAREFA
================================================================= -->
<aside
    class="sp-drawer"
    id="taskDrawer"
    aria-hidden="true"
    aria-labelledby="taskDrawerTitle"
>
    <div class="sp-drawer__backdrop" data-close-task-drawer></div>

    <div class="sp-drawer__panel">
        <div class="sp-drawer__head">
            <div>
                <span class="sp-drawer__eyebrow">Detalhes da tarefa</span>
                <h2 id="taskDrawerTitle">Tarefa Suricata</h2>
            </div>

            <button
                class="sp-icon-btn"
                id="btnCloseTaskDrawer"
                type="button"
                aria-label="Fechar detalhes"
            >
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <path d="M18 6 6 18M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="sp-drawer__body">
            <div class="sp-task-detail-summary">
                <span
                    class="sp-status-pill sp-status-pill--pending"
                    id="drawerTaskStatus"
                >
                    Pendente
                </span>

                <strong id="drawerTaskType">—</strong>
                <small id="drawerTaskId">—</small>
            </div>

            <div class="sp-progress-card">
                <div class="sp-progress-card__head">
                    <span id="drawerTaskStage">Aguardando início</span>
                    <strong id="drawerTaskPercent">0%</strong>
                </div>

                <div class="sp-progress">
                    <span id="drawerTaskProgressBar"></span>
                </div>

                <p id="drawerTaskMessage">
                    Nenhuma atualização disponível.
                </p>
            </div>

            <dl class="sp-task-metadata">
                <div>
                    <dt>Criada</dt>
                    <dd id="drawerTaskCreated">—</dd>
                </div>

                <div>
                    <dt>Iniciada</dt>
                    <dd id="drawerTaskStarted">—</dd>
                </div>

                <div>
                    <dt>Finalizada</dt>
                    <dd id="drawerTaskFinished">—</dd>
                </div>

                <div>
                    <dt>Duração</dt>
                    <dd id="drawerTaskDuration">—</dd>
                </div>
            </dl>

            <div
                class="sp-task-error"
                id="drawerTaskError"
                hidden
            >
                <strong>Erro da tarefa</strong>
                <p id="drawerTaskErrorText"></p>
            </div>

            <div class="sp-drawer-section">
                <div class="sp-drawer-section__head">
                    <h3>Logs da execução</h3>

                    <button
                        class="sp-copy-btn"
                        id="btnCopyTaskLogs"
                        type="button"
                    >
                        Copiar logs
                    </button>
                </div>

                <div class="sp-terminal">
                    <div class="sp-terminal__head">
                        <span class="sp-terminal__dots">
                            <i></i>
                            <i></i>
                            <i></i>
                        </span>

                        <span>moonshield-suricata</span>
                    </div>

                    <div
                        class="sp-terminal__body"
                        id="drawerTaskLogs"
                    >
                        <div class="sp-terminal__empty">
                            Os logs aparecerão aqui.
                        </div>
                    </div>
                </div>
            </div>

            <div class="sp-drawer-section">
                <div class="sp-drawer-section__head">
                    <h3>Resultado</h3>
                </div>

                <pre
                    class="sp-json-output"
                    id="drawerTaskResult"
                >Nenhum resultado disponível.</pre>
            </div>
        </div>

        <div class="sp-drawer__footer">
            <button
                class="sp-btn sp-btn--danger"
                id="btnCancelTask"
                type="button"
                hidden
            >
                Solicitar cancelamento
            </button>

            <button
                class="sp-btn sp-btn--ghost"
                id="btnCloseTaskDrawerFooter"
                type="button"
            >
                Fechar
            </button>
        </div>
    </div>
</aside>
