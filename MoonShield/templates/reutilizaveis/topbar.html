{% load static %}

<header class="topbar" id="topbar">

  <div class="topbar__left">

    <button class="topbar__menu-btn" id="topbarMenuBtn" aria-label="Abrir menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <nav class="topbar__breadcrumb" aria-label="Navegação">
      {% block breadcrumb %}
      <span class="topbar__breadcrumb-item topbar__breadcrumb-item--root">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><polyline points="9 21 9 12 15 12 15 21"/></svg>
        Dashboard
      </span>
      {% endblock %}
    </nav>

  </div>

  <div class="topbar__right">

    <div class="topbar__sensors">
      <div class="topbar__sensor" data-sensor="ids" title="IDS (Suricata)">
        <span class="topbar__sensor-dot topbar__sensor-dot--ok"></span>
        <span class="topbar__sensor-label">IDS</span>
      </div>
      <div class="topbar__sensor" data-sensor="dns" title="DNS (AdGuard)">
        <span class="topbar__sensor-dot topbar__sensor-dot--ok"></span>
        <span class="topbar__sensor-label">DNS</span>
      </div>
      <div class="topbar__sensor" data-sensor="fw" title="Firewall">
        <span class="topbar__sensor-dot topbar__sensor-dot--ok"></span>
        <span class="topbar__sensor-label">FW</span>
      </div>
    </div>

    <div class="topbar__divider"></div>

    <button class="topbar__notif-btn" id="topbarNotifBtn" aria-label="Notificações">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="topbar__notif-count" id="topbarNotifCount" style="display:none">0</span>
    </button>

    <div class="topbar__user" id="topbarUser">
      <div class="topbar__user-avatar" id="topbarAvatar">
        {% if user_profile and user_profile.avatar %}
          <img src="{{ user_profile.avatar.url }}" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
        {% else %}
          <span>{{ request.user.username|slice:":1"|upper }}</span>
        {% endif %}
      </div>
      <span class="topbar__user-name" id="topbarUserName">{{ user_profile.display_name|default:request.user.get_full_name|default:request.user.username }}</span>
    </div>

  </div>

</header>
